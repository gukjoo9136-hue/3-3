<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공격 방식 분류 시스템</title>
    <!-- 1. TensorFlow.js 및 Teachable Machine 라이브러리 로드 -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px auto;
            max-width: 600px;
            text-align: center;
        }
        .upload-box {
            border: 2px dashed #ccc;
            padding: 20px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        #image-preview {
            max-width: 100%;
            max-height: 300px;
            display: none;
            margin: 10px auto;
        }
        #status-message {
            margin: 10px 0;
            font-weight: bold;
            color: #555;
        }
        #label-container div {
            margin: 5px 0;
            padding: 8px;
            background-color: #f4f4f4;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h1>공격 방식 분류 시스템</h1>

    <div>
        <!-- 파일 업로드 영역 -->
        <div class="upload-box" onclick="document.getElementById('image-input').click()">
            <span>📁 클릭하여 이미지 파일(JPG, PNG)을 선택하세요</span>
            <input type="file" id="image-input" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
        </div>

        <!-- 모델 상태 메시지 -->
        <div id="status-message">모델 로딩 준비 중...</div>

        <!-- 이미지 미리보기 -->
        <div>
            <img id="image-preview" alt="분류할 이미지">
        </div>

        <!-- 결과 출력 영역 -->
        <div id="label-container"></div>
    </div>

    <script>
        // ⚠️ Teachable Machine 모델 경로 설정
        // 동일 폴더 내 my_model 폴더가 있다면 "./my_model/"
        // 또는 온라인 URL ("https://teachablemachine.withgoogle.com/models/YOUR_ID/")
        const URL = "./my_model/";

        let model, labelContainer, maxPredictions;

        // 모델 초기화
        async function init() {
            const statusEl = document.getElementById("status-message");
            try {
                const modelURL = URL + "model.json";
                const metadataURL = URL + "metadata.json";

                statusEl.innerText = "모델 불러오는 중...";
                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                labelContainer = document.getElementById("label-container");
                labelContainer.innerHTML = "";
                for (let i = 0; i < maxPredictions; i++) {
                    labelContainer.appendChild(document.createElement("div"));
                }
                statusEl.innerText = "모델 로드 완료! 이미지를 업로드하세요.";
            } catch (error) {
                console.error(error);
                statusEl.innerText = "모델을 불러오지 못했습니다. 경로(URL)를 확인하세요.";
            }
        }

        // 이미지 업로드 및 예측 실행
        async function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const imgElement = document.getElementById("image-preview");
            imgElement.src = javaScriptURL = URL.createObjectURL(file);
            imgElement.style.display = "block";

            imgElement.onload = async function () {
                if (!model) {
                    alert("모델이 아직 로드되지 않았습니다.");
                    return;
                }
                await predict(imgElement);
            };
        }

        // 이미지 예측 로직
        async function predict(imageElement) {
            const prediction = await model.predict(imageElement);
            for (let i = 0; i < maxPredictions; i++) {
                const classPrediction =
                    prediction[i].className + ": " + (prediction[i].probability * 100).toFixed(2) + "%";
                labelContainer.childNodes[i].innerHTML = classPrediction;
            }
        }

        // 페이지 로드 시 모델 로딩 시작
        init();
    </script>
</body>
</html>
